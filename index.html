<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WashTime AI – MM:SS в последнюю минуту</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{
            font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Oxygen,Ubuntu,Cantarell,sans-serif;
            background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);
            min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
        }
        .container{
            background:white;border-radius:20px;box-shadow:0 20px 40px rgba(0,0,0,.1);
            padding:20px 0;max-width:380px;width:100%;
        }
        h1{color:#333;margin-bottom:20px;font-size:24px;font-weight:600;text-align:center}

        .row{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;border-bottom:1px solid #f0f0f0}
        .row:last-child{border-bottom:none}
        .label{font-size:16px;color:#444;font-weight:500}
        .value{font-size:22px;font-weight:600;color:#222;text-align:right}
        .end-row .value{color:#667eea;font-size:22px;font-weight:600;padding-right:24px}
        .left-row .value{color:#ff6b00;font-size:22px;font-weight:600;padding-right:22px}

        .check-row{padding:10px 20px;justify-content:space-between}
        .check-label{font-size:16px;color:#444;font-weight:500}
        .check-box{
            width:22px;height:22px;border:2px solid #667eea;border-radius:4px;
            background:white;cursor:pointer;position:relative;transition:background .2s
        }
        .check-box.checked{background:#667eea}
        .check-box::after{
            content:'';position:absolute;left:6px;top:2px;width:6px;height:12px;
            border:solid white;border-width:0 2px 2px 0;transform:rotate(45deg);display:none
        }
        .check-box.checked::after{display:block}

        input[type=time]{
            border:none;background:transparent;font-size:22px;font-weight:600;color:#222;
            width:auto;cursor:pointer;text-align:right
        }
        input[type=time]:focus{outline:none}
        .dur-picker{display:flex;align-items:center;gap:2px;font-size:22px;font-weight:600;color:#222;cursor:pointer}
        .dur-picker span{padding:2px 4px;border-radius:4px;transition:background .2s}
        .dur-picker span:hover{background:#f0f2ff}

        body.alarm{background:#ff6b00!important;transition:background .3s}

        .scroll-box{
            position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.45);
            display:none;align-items:center;justify-content:center;z-index:999
        }
        .scroll-box.show{display:flex}
        .scroll-panel{background:white;border-radius:16px;padding:15px 8px;display:flex;gap:15px}
        .scroll-col{
            height:180px;overflow-y:scroll;width:70px;scroll-snap-type:y mandatory;
            -ms-overflow-style:none;scrollbar-width:none
        }
        .scroll-col::-webkit-scrollbar{display:none}
        .scroll-col ul{list-style:none}
        .scroll-col li{
            height:30px;display:flex;align-items:center;justify-content:center;font-size:20px;
            color:#555;scroll-snap-align:center;
        }
        .scroll-col li.sel{color:#667efa;font-weight:700}
        .ok-btn{margin-top:10px;width:100%;background:#667eea;color:white;border:none;padding:8px;border-radius:6px;font-size:14px;cursor:pointer}
    </style>
</head>
<body>
    <div class="container">
        <h1>🧺 WashTime AI</h1>

        <div class="row">
            <span class="label">Время старта стирки</span>
            <input type="time" id="startTime" class="value">
        </div>

        <div class="row">
            <span class="label">Длительность стирки</span>
            <input type="time" id="durTime" class="value" value="01:42">
        </div>

        <div class="row end-row">
            <span class="label">Конец стирки:</span>
            <span class="value" id="endShow">--:--</span>
        </div>

        <div class="row left-row">
            <span class="label">Осталось:</span>
            <span class="value" id="leftShow">--:--</span>
        </div>

        <div class="row check-row">
            <span class="check-label">Сигнал по окончанию</span>
            <div class="check-box checked" id="signalToggle"></div>
        </div>
    </div>

    <!-- скролл-окно -->
    <div class="scroll-box" id="scrollBox">
        <div>
            <div class="scroll-panel">
                <div class="scroll-col" id="hCol"><ul id="hList"></ul></div>
                <div class="scroll-col" id="mCol"><ul id="mList"></ul></div>
            </div>
            <button class="ok-btn" id="okBtn">Готово</button>
        </div>
    </div>

    <script>
        const startTimeInput=document.getElementById('startTime');
        const durTime=document.getElementById('durTime');
        const endShow=document.getElementById('endShow');
        const leftShow=document.getElementById('leftShow');
        const signalToggle=document.getElementById('signalToggle');
        const scrollBox=document.getElementById('scrollBox');
        const hList=document.getElementById('hList');
        const mList=document.getElementById('mList');
        const okBtn=document.getElementById('okBtn');

        let hSel=1, mSel=42;
        let signalEnabled=true;
        let alarmFired=false;

        // чекбокс
        signalToggle.classList.toggle('checked',signalEnabled);
        signalToggle.addEventListener('click',()=>{
            signalEnabled=!signalEnabled;
            signalToggle.classList.toggle('checked',signalEnabled);
            if(!signalEnabled)alarmFired=false;
        });

        // Web-Audio пищалка
        const audioCtx=new (window.AudioContext||window.webkitAudioContext)();
        function beep(){
            const osc=audioCtx.createOscillator();
            const gain=audioCtx.createGain();
            osc.type='sine';
            osc.frequency.setValueAtTime(900,audioCtx.currentTime);
            gain.gain.setValueAtTime(0.3,audioCtx.currentTime);
            osc.connect(gain).connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime+0.2);
        }

        // текущее время старта
        const now=new Date();
        startTimeInput.value=`${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;

        function fillLists(){
            hList.innerHTML=''; mList.innerHTML='';
            for(let i=0;i<10;i++){
                const lh=document.createElement('li'); lh.textContent=String(i).padStart(2,'0'); lh.dataset.val=i;
                if(i===hSel)lh.classList.add('sel');
                hList.appendChild(lh);
            }
            for(let i=0;i<60;i++){
                const lm=document.createElement('li'); lm.textContent=String(i).padStart(2,'0'); lm.dataset.val=i;
                if(i===mSel)lm.classList.add('sel');
                mList.appendChild(lm);
            }
        }
        fillLists();

        function centerItem(col,idx){
            const liH=30;
            col.scrollTop=idx*liH-2*liH;
        }
        centerItem(hCol,hSel); centerItem(mCol,mSel);

        durTime.addEventListener('focus',()=>{
            scrollBox.classList.add('show');
            centerItem(hCol,hSel);
        });

        [hList,mList].forEach(list=>{
            list.addEventListener('click',e=>{
                if(e.target.tagName!=='LI')return;
                list.querySelectorAll('li').forEach(x=>x.classList.remove('sel'));
                e.target.classList.add('sel');
                const val=Number(e.target.dataset.val);
                if(list===hList)hSel=val; else mSel=val;
                centerItem(list.parentElement,val);
                updateTimes();
            });
        });

        function wheelScroll(col,list,max,storage){
            col.addEventListener('wheel',e=>{
                e.preventDefault();
                let next=storage+(e.deltaY>0?1:-1);
                if(next<0)next=max; if(next>max)next=0;
                storage=next;
                list.querySelectorAll('li').forEach(x=>x.classList.remove('sel'));
                list.children[next].classList.add('sel');
                centerItem(col,next);
                if(list===hList)hSel=next; else mSel=next;
                updateTimes();
            });
        }
        wheelScroll(hCol,hList,9,hSel);
        wheelScroll(mCol,mList,59,mSel);

        okBtn.addEventListener('click',()=>{
            durTime.value=`${String(hSel).padStart(2,'0')}:${String(mSel).padStart(2,'0')}`;
            scrollBox.classList.remove('show');
            updateTimes();
        });

        function updateTimes(){
            const startVal=startTimeInput.value;
            const totalMin=hSel*60+mSel;
            if(!startVal){endShow.textContent='--:--';leftShow.textContent='--:--';return;}

            const[startH,startM]=startVal.split(':').map(Number);
            const startDate=new Date();startDate.setHours(startH,startM,0,0);
            const endDate=new Date(startDate.getTime()+totalMin*60000);

            const endStr=`${String(endDate.getHours()).padStart(2,'0')}:${String(endDate.getMinutes()).padStart(2,'0')}`;
            endShow.textContent=endStr;

            const nowMs=Date.now();
            let leftMs=endDate.getTime()-nowMs;

            // ≤ 0 – стирка закончилась
            if(leftMs<=0){
                leftShow.textContent='00:00';
                if(!alarmFired&&signalEnabled){fireAlarm();}
                return;
            }

            alarmFired=false;

            // ≤ 60 сек – показываем MM:SS
            if(leftMs<=60000){
                const leftSec=Math.ceil(leftMs/1000);   // округляем ВВЕРХ до секунды
                const ls=leftSec%60;
                const lm=Math.floor(leftSec/60);
                leftShow.textContent=`${String(lm).padStart(2,'0')}:${String(ls).padStart(2,'0')}`;
                return;
            }

            // обычные минуты
            const leftMin=Math.round(leftMs/60000);
            const lh=Math.floor(leftMin/60);
            const lm=leftMin%60;
            leftShow.textContent=`${String(lh).padStart(2,'0')}:${String(lm).padStart(2,'0')}`;
        }

        function fireAlarm(){
            alarmFired=true;
            beep();
            document.body.classList.add('alarm');
            setTimeout(()=>document.body.classList.remove('alarm'),3000);
        }

        startTimeInput.addEventListener('change',()=>{alarmFired=false;updateTimes();});
        updateTimes();
        setInterval(updateTimes,1000);
    </script>
</body>
</html>
