<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png">
<link rel="manifest" href="/icons/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="WashTime AI">
<meta name="theme-color" content="#667eea">
<title>WashTime AI</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);
min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
}
.container{
background:white;border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,0.1);
padding:20px 0;max-width:400px;width:100%;
}
h1{color:#333;margin:0 0 15px;text-align:center;font-size:22px}
.tabs{display:flex;border-bottom:1px solid #eee}
.tab{
flex:1;padding:10px;text-align:center;background:none;border:none;
color:#666;font-size:15px;cursor:pointer
}
.tab.active{color:#667eea;font-weight:bold}
.panels{padding:15px}
.row{display:flex;justify-content:space-between;align-items:center;padding:8px 0}
.label{font-size:14px;color:#444}
.value{font-size:18px;font-weight:bold;color:#222;text-align:right}
.end-row .value{color:#667eea}
.left-row .value{color:#ff6b00}
.durTime{
background:none;border:none;font-size:18px;font-weight:bold;color:#222;
text-align:right;cursor:pointer
}
.prog-select{width:60px;font-size:16px;text-align:center;border:1px solid #ddd;border-radius:4px}
.check-row{padding-top:5px}
.check-label{font-size:14px}
.check-box{
width:18px;height:18px;border:2px solid #667eea;border-radius:3px;
background:white;cursor:pointer;position:relative
}
.check-box.checked{background:#667eea}
.check-box.checked::after{
content:'';position:absolute;left:4px;top:1px;width:5px;height:9px;
border:solid white;border-width:0 2px 2px 0;transform:rotate(45deg);display:block
}
.scroll-box{
position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);
display:none;align-items:center;justify-content:center;z-index:1000
}
.scroll-panel{
background:white;border-radius:12px;padding:15px;display:flex;gap:15px
}
.scroll-col{
height:180px;overflow-y:auto;width:70px;
-ms-overflow-style:none;scrollbar-width:none
}
.scroll-col::-webkit-scrollbar{display:none}
.scroll-col ul{list-style:none;padding:0;margin:0}
.scroll-col li{
height:30px;display:flex;align-items:center;justify-content:center;
font-size:18px;color:#555;cursor:pointer
}
.scroll-col li.sel{color:#667eea;font-weight:bold}
.ok-btn{
display:block;width:100%;margin-top:10px;padding:8px;
background:#667eea;color:white;border:none;border-radius:6px;font-size:15px;cursor:pointer
}
.startStopBtn{
display:block;width:100%;margin-top:15px;padding:8px;
background:#667eea;color:white;border:none;border-radius:6px;font-size:15px;font-weight:bold;cursor:pointer
}
.startStopBtn.stop{background:#ff6b00}
body.alarm{background:#ffebee!important}
</style>
</head>
<body>
<div class="container">
<h1>WashTime AI</h1>
<div class="tabs">
<button class="tab active" data-machine="wash">Стиральная</button>
<button class="tab" data-machine="dry">Сушильная</button>
<button class="tab" data-machine="dish">Посудомойка</button>
</div>
<div class="panels" id="panels"></div>
</div>
<div class="scroll-box" id="scrollBox">
<div>
<div class="scroll-panel">
<div class="scroll-col" id="hCol"><ul id="hList"></ul></div>
<div class="scroll-col" id="mCol"><ul id="mList"></ul></div>
</div>
<button class="ok-btn" id="okBtn">Готово</button>
</div>
</div>
<script>
/* ---------- ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ---------- */
function timeNow() {
  const now = new Date();
  return `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
}

/* ---------- ДАННЫЕ МАШИН ---------- */
const machines = {
  wash: { h: 1, m: 42, isRunning: false, hasFinished: false, startTimeVal: timeNow() },
  dry: { h: 1, m: 15, isRunning: false, hasFinished: false, startTimeVal: timeNow() },
  dish: {
    prog: 2,
    progTimes: {1:'02:45',2:'02:00',3:'02:30',4:'00:55',5:'01:40',6:'00:10',7:'00:50'},
    h: 2, m: 0, isRunning: false, hasFinished: false, startTimeVal: timeNow()
  }
};

/* ---------- SAMSUNG MELODY (ОДИН РАЗ) ---------- */
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playNote(freq, startTime, duration = 0.15, volume = 0.25) {
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(freq, startTime);
  gain.gain.setValueAtTime(volume, startTime);
  gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(startTime);
  osc.stop(startTime + duration);
}
function samsungMelodyOnce() {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const now = audioCtx.currentTime;
  const noteDur = 0.15;
  const gap = 0.1;
  const groupPause = 0.4;
  const notes = [659.25, 783.99, 1046.50];
  for (let i = 0; i < 3; i++) {
    playNote(notes[i], now + i * (noteDur + gap), noteDur);
  }
  for (let i = 0; i < 3; i++) {
    playNote(notes[i], now + groupPause + i * (noteDur + gap), noteDur);
  }
}

/* ---------- БЕЗОПАСНАЯ ОТПРАВКА В TELEGRAM ЧЕРЕЗ Vercel ---------- */
async function sendTelegramNotification(messageText) {
  try {
    await fetch('/api/notify', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: messageText })
    });
  } catch (e) {
    console.warn('Не удалось отправить уведомление:', e);
  }
}

/* ---------- ЭЛЕМЕНТЫ DOM ---------- */
const panels = document.getElementById('panels');
const scrollBox = document.getElementById('scrollBox');
const hList = document.getElementById('hList');
const mList = document.getElementById('mList');
const okBtn = document.getElementById('okBtn');
let activeMachine = 'wash';
let hSel = 1, mSel = 42;
let signalEnabled = true;

/* ---------- ЗАПОЛНЕНИЕ СПИСКОВ ВРЕМЕНИ ---------- */
function fillLists() {
  hList.innerHTML = '';
  mList.innerHTML = '';
  for (let i = 0; i < 10; i++) {
    const li = document.createElement('li');
    li.textContent = String(i).padStart(2, '0');
    li.dataset.val = i;
    hList.appendChild(li);
  }
  for (let i = 0; i < 60; i++) {
    const li = document.createElement('li');
    li.textContent = String(i).padStart(2, '0');
    li.dataset.val = i;
    mList.appendChild(li);
  }
}

/* ---------- РЕНДЕР Панели ---------- */
function renderPanel(key) {
  const m = machines[key];
  const isDish = key === 'dish';
  const durValue = isDish ? m.progTimes[m.prog] : `${String(m.h).padStart(2,'0')}:${String(m.m).padStart(2,'0')}`;
  return `
<div class="panel" id="panel-${key}" data-machine="${key}" style="display:${key===activeMachine?'block':'none'}">
<div class="row">
<span class="label">Время старта</span>
<input type="time" class="value startTime" value="${m.startTimeVal}">
</div>
${isDish ? `
<div class="row">
<span class="label">Программа</span>
<select class="prog-select">
${[1,2,3,4,5,6,7].map(p => `<option value="${p}" ${p===m.prog?'selected':''}>${p}</option>`).join('')}
</select>
</div>` : ''}
<div class="row">
<span class="label">Длительность</span>
<input type="text" class="value durTime" value="${durValue}" readonly>
</div>
<div class="row end-row">
<span class="label">Конец:</span>
<span class="value endShow">--:--</span>
</div>
<div class="row left-row">
<span class="label">Осталось:</span>
<span class="value leftShow">--:--</span>
</div>
<div class="row check-row">
<span class="check-label">Сигнал по окончанию</span>
<div class="check-box ${signalEnabled?'checked':''}"></div>
</div>
<button class="startStopBtn ${machines[key].isRunning ? 'stop' : ''}">
${machines[key].isRunning ? 'Стоп' : 'Старт'}
</button>
</div>`;
}
function initPanels() {
  Object.keys(machines).forEach(k => panels.insertAdjacentHTML('beforeend', renderPanel(k)));
}

/* ---------- ПЕРЕКЛЮЧЕНИЕ ВКЛАДОК ---------- */
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    activeMachine = tab.dataset.machine;
    document.querySelectorAll('.panel').forEach(p => {
      p.style.display = p.dataset.machine === activeMachine ? 'block' : 'none';
    });
    updateMachine(activeMachine);
  });
});

/* ---------- ОБРАБОТКА ФОКУСА НА ДЛИТЕЛЬНОСТИ ---------- */
panels.addEventListener('focusin', e => {
  if (e.target.classList.contains('durTime')) {
    const panel = e.target.closest('.panel');
    const key = panel.dataset.machine;
    const m = machines[key];
    hSel = m.h; mSel = m.m;
    document.querySelectorAll('#hList li, #mList li').forEach(li => li.classList.remove('sel'));
    const hItems = hList.querySelectorAll('li');
    const mItems = mList.querySelectorAll('li');
    if (hItems[hSel]) hItems[hSel].classList.add('sel');
    if (mItems[mSel]) mItems[mSel].classList.add('sel');
    centerItem(hCol, hSel);
    centerItem(mCol, mSel);
    scrollBox.style.display = 'flex';
  }
});

/* ---------- START / STOP ---------- */
document.addEventListener('click', e => {
  if (e.target.classList.contains('startStopBtn')) {
    const panel = e.target.closest('.panel');
    const key = panel.dataset.machine;
    const m = machines[key];
    if (!m.isRunning) {
      m.hasFinished = false;
    }
    m.isRunning = !m.isRunning;
    e.target.textContent = m.isRunning ? 'Стоп' : 'Старт';
    e.target.classList.toggle('stop', m.isRunning);
    updateMachine(key);
  }
});

/* ---------- ИЗМЕНЕНИЕ ВРЕМЕНИ СТАРТА ИЛИ ПРОГРАММЫ ---------- */
document.addEventListener('change', e => {
  if (e.target.classList.contains('startTime')) {
    const key = e.target.closest('.panel').dataset.machine;
    machines[key].startTimeVal = e.target.value;
    updateMachine(key);
  }
  if (e.target.classList.contains('prog-select')) {
    const key = e.target.closest('.panel').dataset.machine;
    machines[key].prog = +e.target.value;
    const [h, mm] = machines[key].progTimes[machines[key].prog].split(':').map(Number);
    machines[key].h = h;
    machines[key].m = mm;
    document.querySelector(`.panel[data-machine="${key}"] .durTime`).value = machines[key].progTimes[machines[key].prog];
    updateMachine(key);
  }
});

/* ---------- ЧЕКБОКС СИГНАЛА ---------- */
document.addEventListener('click', e => {
  if (e.target.classList.contains('check-box')) {
    signalEnabled = !signalEnabled;
    document.querySelectorAll('.check-box').forEach(cb => cb.classList.toggle('checked', signalEnabled));
  }
});

/* ---------- СКРОЛЛ-ВЫБОР ВРЕМЕНИ ---------- */
function centerItem(col, idx) {
  const liH = 30;
  col.scrollTop = idx * liH - 2 * liH;
}
[hList, mList].forEach(list => {
  list.addEventListener('click', e => {
    if (e.target.tagName !== 'LI') return;
    list.querySelectorAll('li').forEach(li => li.classList.remove('sel'));
    e.target.classList.add('sel');
    const val = Number(e.target.dataset.val);
    if (list === hList) hSel = val; else mSel = val;
  });
});
function setupWheelScroll(col, max) {
  col.addEventListener('wheel', e => {
    e.preventDefault();
    let next = (col.id === 'hCol' ? hSel : mSel) + (e.deltaY > 0 ? 1 : -1);
    if (next < 0) next = max;
    if (next > max) next = 0;
    if (col.id === 'hCol') hSel = next; else mSel = next;
    const list = col.querySelector('ul');
    list.querySelectorAll('li').forEach(li => li.classList.remove('sel'));
    list.children[next].classList.add('sel');
    centerItem(col, next);
  });
}
setupWheelScroll(hCol, 9);
setupWheelScroll(mCol, 59);
okBtn.addEventListener('click', () => {
  const m = machines[activeMachine];
  m.h = hSel;
  m.m = mSel;
  document.querySelector(`.panel[data-machine="${activeMachine}"] .durTime`).value =
    `${String(hSel).padStart(2,'0')}:${String(mSel).padStart(2,'0')}`;
  scrollBox.style.display = 'none';
  updateMachine(activeMachine);
});

/* ---------- ОСНОВНАЯ ЛОГИКА ВРЕМЕНИ (ИСПРАВЛЕНА!) ---------- */
function updateMachine(key) {
  const m = machines[key];
  const panel = document.querySelector(`.panel[data-machine="${key}"]`);
  const startVal = m.startTimeVal;

  // Валидация
  if (!startVal || !/^\d{2}:\d{2}$/.test(startVal)) {
    panel.querySelector('.endShow').textContent = '--:--';
    panel.querySelector('.leftShow').textContent = '--:--';
    return;
  }

  const [sh, sm] = startVal.split(':').map(Number);
  if (isNaN(sh) || isNaN(sm) || sh < 0 || sh > 23 || sm < 0 || sm > 59) {
    panel.querySelector('.endShow').textContent = '--:--';
    panel.querySelector('.leftShow').textContent = '--:--';
    return;
  }

  // Дата старта — всегда сегодня (пользователь сам ввёл время)
  const now = new Date();
  const startDate = new Date(now.getFullYear(), now.getMonth(), now.getDate(), sh, sm, 0, 0);

  // Время окончания
  const totalMs = (m.h * 60 + m.m) * 60000;
  const endDate = new Date(startDate.getTime() + totalMs);
  const endStr = `${String(endDate.getHours()).padStart(2, '0')}:${String(endDate.getMinutes()).padStart(2, '0')}`;
  panel.querySelector('.endShow').textContent = endStr;

  // Если таймер не запущен
  if (!m.isRunning) {
    panel.querySelector('.leftShow').textContent = '--:--';
    const btn = panel.querySelector('.startStopBtn');
    if (btn) {
      btn.textContent = 'Старт';
      btn.classList.remove('stop');
    }
    return;
  }

  // Оставшееся время до реального окончания
  const leftMs = endDate.getTime() - now.getTime();

  // Завершение
  if (leftMs <= 0) {
    panel.querySelector('.leftShow').textContent = '00:00';
    if (signalEnabled && !m.hasFinished) {
      fireFinalSignal(key);
    }
    return;
  }

  // --- Отображение оставшегося времени ---
  if (leftMs < 60000) {
    // Менее минуты — секунды
    const leftSec = Math.ceil(leftMs / 1000);
    const lm = Math.floor(leftSec / 60);
    const ls = leftSec % 60;
    panel.querySelector('.leftShow').textContent = `${String(lm).padStart(2, '0')}:${String(ls).padStart(2, '0')}`;
  } else {
    // Больше минуты — часы и минуты (ограничено 99 часами)
    const totalMinutes = Math.ceil(leftMs / 60000);
    const lh = Math.floor(totalMinutes / 60);
    const lm = totalMinutes % 60;
    if (lh > 99) {
      panel.querySelector('.leftShow').textContent = '99:59';
    } else {
      panel.querySelector('.leftShow').textContent = `${String(lh).padStart(2, '0')}:${String(lm).padStart(2, '0')}`;
    }
  }
}

/* ---------- ФИНАЛЬНЫЙ СИГНАЛ (ТОЛЬКО ОДИН РАЗ) ---------- */
function fireFinalSignal(key) {
  const m = machines[key];
  if (m.hasFinished) return;
  m.hasFinished = true;
  m.isRunning = false;

  // Звук
  samsungMelodyOnce();

  // Текст
  const texts = { wash: 'достиралась!', dry: 'досушилась!', dish: 'домылась!' };
  const names = { wash: 'Стиральная машина', dry: 'Сушильная машина', dish: 'Посудомойка' };
  const message = `${names[key]} ${texts[key]}`;

  // Уведомление + вибрация (работает на заблокированном экране через SW)
  showPushNotification('✅ WashTime AI', message, `washtime-${key}`);

  // Telegram
  sendTelegramNotification(message);

  // Обновление UI
  const panel = document.querySelector(`.panel[data-machine="${key}"]`);
  if (panel) {
    panel.querySelector('.leftShow').textContent = '00:00';
    const btn = panel.querySelector('.startStopBtn');
    if (btn) {
      btn.textContent = 'Старт';
      btn.classList.remove('stop');
    }
  }

  // Визуальный эффект
  document.body.classList.add('alarm');
  setTimeout(() => document.body.classList.remove('alarm'), 3000);
}

/* ---------- SERVICE WORKER ---------- */
let swRegistration = null;

async function registerSW() {
  if (!('serviceWorker' in navigator)) return;
  try {
    swRegistration = await navigator.serviceWorker.register('/api/sw', { scope: '/' });
    console.log('SW зарегистрирован');
  } catch (e) {
    console.warn('SW не зарегистрирован:', e);
  }
}

async function requestNotifyPermission() {
  if (!('Notification' in window)) return;
  if (Notification.permission === 'default') {
    await Notification.requestPermission();
  }
}

/* ---------- ПОКАЗАТЬ УВЕДОМЛЕНИЕ (через SW или напрямую) ---------- */
async function showPushNotification(title, body, tag) {
  // Вибрация — всегда если страница активна
  if ('vibrate' in navigator) {
    navigator.vibrate([500, 200, 500, 200, 500]);
  }

  if (Notification.permission !== 'granted') return;

  // Через Service Worker — работает на заблокированном экране
  if (swRegistration && swRegistration.active) {
    swRegistration.active.postMessage({ type: 'NOTIFY', title, body, tag });
    return;
  }

  // Fallback — обычное уведомление
  new Notification(title, {
    body,
    icon: '/icons/icon-192.png',
    vibrate: [500, 200, 500],
    requireInteraction: true,
    tag
  });
}

/* ---------- ИНИЦИАЛИЗАЦИЯ ---------- */
registerSW();
requestNotifyPermission();
fillLists();
initPanels();
document.querySelector('.tab').click();
setInterval(() => Object.keys(machines).forEach(k => updateMachine(k)), 1000);
</script>
</body>
</html>
