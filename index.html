<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1" />
<!-- Иконки -->
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png">
<!-- Манифест -->
<link rel="manifest" href="/icons/manifest.json">
<!-- iOS -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="WashTime AI">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<!-- Тема -->
<meta name="theme-color" content="#667eea">
<title>WashTime AI</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:sans-serif;background:#f5f7ff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.container{background:white;border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,0.1);padding:20px;max-width:400px;width:100%}
h1{text-align:center;margin-bottom:20px;color:#333}
.tabs{display:flex;gap:1px;background:#e0e0e0;border-radius:8px;overflow:hidden}
.tab{flex:1;padding:10px;text-align:center;background:white;border:none;cursor:pointer;font-size:15px;color:#555}
.tab.active{background:#667eea;color:white}
.panel{display:none}
.panel.active{display:block}
.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee}
.row:last-child{border-bottom:none}
.label{color:#444}
.value{font-weight:bold;color:#222;text-align:right}
.check-row{align-items:center}
.check-box{width:18px;height:18px;border:2px solid #667eea;border-radius:3px;cursor:pointer}
.check-box.checked{background:#667eea}
.check-box.checked::after{content:'';display:block;width:6px;height:10px;border:solid white;border-width:0 2px 2px 0;transform:rotate(45deg);margin:1px 0 0 4px}
#finishBox{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);display:none;align-items:center;justify-content:center;z-index:1000}
#finishBox div{background:white;padding:20px;border-radius:12px;text-align:center;max-width:300px;width:90%}
#finishClose{margin-top:15px;background:#667eea;color:white;border:none;padding:8px 16px;border-radius:6px;cursor:pointer}
body.alarm{background:#ffebee!important}
</style>
</head>
<body>

<div class="container">
  <h1>WashTime AI</h1>
  <div class="tabs">
    <button class="tab active" data-machine="wash">Стиральная</button>
    <button class="tab" data-machine="dry">Сушильная</button>
    <button class="tab" data-machine="dish">Посудомойка</button>
  </div>
  <div id="panels"></div>
</div>

<div id="finishBox">
  <div>
    <div id="finishText" style="font-size:18px;margin-bottom:15px;"></div>
    <button id="finishClose">OK</button>
  </div>
</div>

<script>
// Данные
const machines = {
  wash: { h: 1, m: 42 },
  dry: { h: 1, m: 15 },
  dish: { prog: 2, progTimes: {1:'02:45',2:'02:00',3:'02:30',4:'00:55',5:'01:40',6:'00:10',7:'00:50'} }
};

// Samsung мелодия
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
let melodyActive = false;
let melodyTimeout = null;

function playNote(freq, startTime, duration = 0.15, volume = 0.25) {
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(freq, startTime);
  gain.gain.setValueAtTime(volume, startTime);
  gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(startTime);
  osc.stop(startTime + duration);
}

function samsungMelody(loop = true) {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const now = audioCtx.currentTime;
  const noteDur = 0.15;
  const gap = 0.1;
  const groupPause = 0.4;
  const notes = [659.25, 783.99, 1046.50];
  for (let i = 0; i < 3; i++) playNote(notes[i], now + i * (noteDur + gap), noteDur);
  for (let i = 0; i < 3; i++) playNote(notes[i], now + groupPause + i * (noteDur + gap), noteDur);
  if (loop && melodyActive) melodyTimeout = setTimeout(() => samsungMelody(true), 2000);
}

function stopMelody() {
  melodyActive = false;
  if (melodyTimeout) clearTimeout(melodyTimeout);
}

// Элементы
const panels = document.getElementById('panels');
const finishBox = document.getElementById('finishBox');
const finishText = document.getElementById('finishText');
const finishClose = document.getElementById('finishClose');

let activeMachine = 'wash';
let signalEnabled = true;
let alarmFired = false;

// Рендер панелей
function renderPanel(key) {
  const m = machines[key];
  const isDish = key === 'dish';
  const durValue = isDish ? m.progTimes[m.prog] : `${String(m.h).padStart(2,'0')}:${String(m.m).padStart(2,'0')}`;
  return `
    <div class="panel ${key === activeMachine ? 'active' : ''}" data-machine="${key}">
      <div class="row">
        <span class="label">Старт</span>
        <input type="time" class="startTime" value="${new Date().toTimeString().slice(0,5)}">
      </div>
      ${isDish ? `<div class="row"><span class="label">Программа</span><select class="prog">${[1,2,3,4,5,6,7].map(p=>`<option ${p===m.prog?'selected':''}>${p}</option>`).join('')}</select></div>` : ''}
      <div class="row">
        <span class="label">Длительность</span>
        <span class="value">${durValue}</span>
      </div>
      <div class="row">
        <span class="label">Конец</span>
        <span class="endShow">--:--</span>
      </div>
      <div class="row">
        <span class="label">Осталось</span>
        <span class="leftShow">--:--</span>
      </div>
      <div class="row check-row">
        <span class="label">Сигнал</span>
        <div class="check-box ${signalEnabled ? 'checked' : ''}"></div>
      </div>
    </div>`;
}

function init() {
  Object.keys(machines).forEach(k => panels.innerHTML += renderPanel(k));
  
  // Переключение вкладок
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      activeMachine = tab.dataset.machine;
      document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.dataset.machine === activeMachine));
      updateMachine(activeMachine);
    });
  });

  // Чекбокс
  document.querySelector('.check-box').addEventListener('click', e => {
    signalEnabled = !signalEnabled;
    document.querySelectorAll('.check-box').forEach(cb => cb.classList.toggle('checked', signalEnabled));
  });

  // Программы посудомойки
  document.querySelectorAll('.prog').forEach(sel => {
    sel.addEventListener('change', e => {
      const prog = +sel.value;
      machines.dish.prog = prog;
      const [h,m] = machines.dish.progTimes[prog].split(':').map(Number);
      machines.dish.h = h; machines.dish.m = m;
      document.querySelector('.panel[data-machine="dish"] .value').textContent = machines.dish.progTimes[prog];
      updateMachine('dish');
    });
  });

  // Время старта
  document.querySelectorAll('.startTime').forEach(inp => {
    inp.addEventListener('change', e => updateMachine(e.target.closest('.panel').dataset.machine));
  });

  updateMachine(activeMachine);
  setInterval(() => Object.keys(machines).forEach(updateMachine), 1000);
}

// Обновление таймера
function updateMachine(key) {
  const panel = document.querySelector(`.panel[data-machine="${key}"]`);
  const startInput = panel.querySelector('.startTime');
  const startVal = startInput.value;
  const m = machines[key];
  const totalMin = (m.h * 60 + m.m);
  if (!startVal) {
    panel.querySelector('.endShow').textContent = '--:--';
    panel.querySelector('.leftShow').textContent = '--:--';
    return;
  }
  const [sh, sm] = startVal.split(':').map(Number);
  const startDate = new Date(); startDate.setHours(sh, sm, 0, 0);
  const endDate = new Date(startDate.getTime() + totalMin * 60000);
  const endStr = `${String(endDate.getHours()).padStart(2,'0')}:${String(endDate.getMinutes()).padStart(2,'0')}`;
  panel.querySelector('.endShow').textContent = endStr;
  const leftMs = endDate.getTime() - Date.now();
  if (leftMs <= 0) {
    panel.querySelector('.leftShow').textContent = '00:00';
    if (!alarmFired && signalEnabled) fireAlarm(key);
    return;
  }
  alarmFired = false;
  const leftSec = Math.ceil(leftMs / 1000);
  const lm = Math.floor(leftSec / 60);
  const ls = leftSec % 60;
  panel.querySelector('.leftShow').textContent = `${String(lm).padStart(2,'0')}:${String(ls).padStart(2,'0')}`;
}

// Финальный сигнал
function fireAlarm(key) {
  if (alarmFired) return;
  alarmFired = true;
  melodyActive = true;
  samsungMelody(true);
  document.body.classList.add('alarm');

  const texts = { wash: 'достиралась!', dry: 'досушилась!', dish: 'домылась!' };
  const names = { wash: 'Стиральная машина', dry: 'Сушильная машина', dish: 'Посудомойка' };
  const message = `${names[key]} ${texts[key]}`;

  if ('serviceWorker' in navigator && Notification.permission === 'granted') {
    navigator.serviceWorker.ready.then(reg => {
      reg.showNotification('WashTime AI', {
        body: message,
        icon: '/icons/icon-192.png',
        vibrate: [300, 200, 300],
        requireInteraction: true,
        tag: 'wash-complete'
      });
    });
  } else {
    finishText.textContent = message;
    finishBox.style.display = 'flex';
  }

  setTimeout(() => document.body.classList.remove('alarm'), 3000);
}

// Остановка мелодии
finishClose.addEventListener('click', () => {
  finishBox.style.display = 'none';
  stopMelody();
});

window.addEventListener('focus', stopMelody);

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.addEventListener('message', e => {
    if (e.data?.type === 'stopMelody') stopMelody();
  });
}

// Запрос уведомлений
if ('Notification' in window && Notification.permission === 'default') {
  Notification.requestPermission();
}

// Регистрация SW
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(console.error);
  });
}

init();
</script>
</body>
</html>
