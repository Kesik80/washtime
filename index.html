<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>YEVA</title>
<meta name="theme-color" content="#5CBFE6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/icons/manifest.json">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="icon" href="/icons/favicon.ico" sizes="any">
<meta name="apple-mobile-web-app-title" content="YEVA">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{
    height:100%;background:#5CBFE6;
    background-image:
      radial-gradient(120% 80% at 18% 108%, rgba(255,224,138,.55), transparent 60%),
      radial-gradient(90% 60% at 86% 6%, rgba(255,154,213,.32), transparent 65%),
      linear-gradient(180deg,#5CBFE6 0%,#8FDCF2 42%,#CFF0FB 78%,#EAF9FF 100%);
    background-attachment:fixed;background-repeat:no-repeat;background-size:cover;
    overscroll-behavior:none;
  }
  body{
    font-family:'Fredoka',ui-rounded,'SF Pro Rounded',system-ui,-apple-system,'Segoe UI',sans-serif;
    color:#1E3D57;
    background:transparent;
    min-height:100%;min-height:100dvh;
    display:flex;flex-direction:column;align-items:center;
    padding:calc(env(safe-area-inset-top,0px) + 34px) 20px calc(env(safe-area-inset-bottom,0px) + 34px);
    user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
    overflow-x:hidden;
  }

  /* плавающие пузыри на фоне */
  .bg{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
  .bg i{
    position:absolute;border-radius:50%;
    background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.95),rgba(255,255,255,.25) 30%,rgba(255,154,213,.35) 58%,rgba(155,246,208,.4) 80%,rgba(255,255,255,.85) 100%);
    box-shadow:inset 0 0 24px rgba(255,255,255,.6);
    animation:rise linear infinite;
  }
  @keyframes rise{
    from{transform:translateY(20vh) translateX(0) scale(1);opacity:0}
    10%{opacity:.85}
    90%{opacity:.85}
    to{transform:translateY(-110vh) translateX(30px) scale(1.1);opacity:0}
  }

  .title{
    position:relative;z-index:1;
    font-size:clamp(46px,15vw,84px);font-weight:600;letter-spacing:.06em;
    color:#fff;text-shadow:0 6px 24px rgba(30,61,87,.28);
    cursor:default;
  }
  .title.hold{animation:squeeze .9s ease}
  @keyframes squeeze{50%{transform:scale(.94)}}
  .sub{position:relative;z-index:1;font-size:15px;color:rgba(30,61,87,.6);margin-top:4px;margin-bottom:34px}

  .games{
    position:relative;z-index:1;
    width:100%;max-width:520px;
    display:grid;grid-template-columns:1fr;gap:18px;
  }
  @media (min-width:560px){ .games{grid-template-columns:1fr 1fr} }

  .game{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    text-decoration:none;color:#1E3D57;
    background:rgba(255,255,255,.62);
    -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
    border-radius:28px;padding:30px 22px;
    box-shadow:0 12px 34px rgba(30,61,87,.16);
    transition:transform .15s ease;
  }
  .game:active{transform:scale(.96)}
  .game .art{
    width:112px;height:112px;border-radius:50%;
    display:grid;place-items:center;font-size:56px;
    background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.98),rgba(255,255,255,.3) 30%,rgba(255,154,213,.42) 56%,rgba(155,246,208,.48) 78%,rgba(255,255,255,.92) 100%);
    box-shadow:0 10px 26px rgba(30,61,87,.18),inset 0 0 28px rgba(255,255,255,.65);
    animation:float 3.6s ease-in-out infinite;
  }
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
  .game .name{font-size:22px;font-weight:600}
  .game .tag{font-size:13px;color:rgba(30,61,87,.55);margin-top:-6px}

  .game.soon{opacity:.45;pointer-events:none}
  .game.soon .art{animation:none;background:rgba(255,255,255,.5);font-size:44px;color:rgba(30,61,87,.4)}

  @media (prefers-reduced-motion:reduce){
    .bg i,.game .art{animation:none}
  }
</style>
</head>
<body data-install="banner">

<div class="bg" id="bg"></div>

<div class="title" id="title">YEVA</div>
<div class="sub">Spiele auf Deutsch</div>

<div class="games">
  <a class="game" href="bubbles.html">
    <div class="art">🫧</div>
    <div class="name">Seifenblasen</div>
    <div class="tag">Мыльные пузыри</div>
  </a>

  <div class="game soon">
    <div class="art">＋</div>
    <div class="name">bald</div>
    <div class="tag">скоро</div>
  </div>
</div>

<script>
(() => {
  'use strict';

  // фоновые пузыри
  const bg = document.getElementById('bg');
  for (let i = 0; i < 9; i++) {
    const b = document.createElement('i');
    const s = 28 + Math.random() * 74;
    b.style.width = s + 'px';
    b.style.height = s + 'px';
    b.style.left = (Math.random() * 100) + 'vw';
    b.style.bottom = '-20vh';
    b.style.animationDuration = (14 + Math.random() * 16) + 's';
    b.style.animationDelay = (-Math.random() * 22) + 's';
    bg.appendChild(b);
  }

  // Скрытый вход в генератор голосов: удержать надпись YEVA полторы секунды.
  // Ребёнок так не попадёт, взрослый попадёт с первого раза.
  const title = document.getElementById('title');
  let timer = null;

  const start = () => {
    clearTimeout(timer);
    title.classList.add('hold');
    timer = setTimeout(() => { location.href = 'voicegen.html'; }, 1500);
  };
  const stop = () => {
    clearTimeout(timer);
    title.classList.remove('hold');
  };

  title.addEventListener('pointerdown', start);
  title.addEventListener('pointerup', stop);
  title.addEventListener('pointerleave', stop);
  title.addEventListener('pointercancel', stop);
  title.addEventListener('contextmenu', e => e.preventDefault());

  // запасной вход, если удержание не сработает: /?voice
  if (location.search.indexOf('voice') >= 0) location.href = 'voicegen.html';
})();
</script>
<script src="install.js"></script>
<script src="console.js"></script>
</body>
</html>
